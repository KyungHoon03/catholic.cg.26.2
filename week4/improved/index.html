<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>복합 연구시설 — 관찰 지원 뷰어</title><link rel="icon" href="data:,"><link rel="stylesheet" href="demo.css">
<style>
.wrap{grid-template-columns:minmax(0,1fr) 18rem;height:100vh;height:100dvh;min-height:500px}.stage{display:grid;grid-template-rows:minmax(240px,1fr) auto auto;align-items:stretch;justify-content:stretch;min-height:0;overflow:auto}.viewport{position:relative;min-height:0}.stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%;max-height:none;cursor:grab}
canvas:focus-visible{outline:2px solid var(--d-accent);outline-offset:-2px}.readings{padding:10px 14px;white-space:pre-wrap;font:12px/1.6 monospace;color:var(--d-ink)}
.instructions{padding:0 14px}.tasks{padding-left:22px}.tasks li{margin:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}
#student-ui{display:grid;grid-template-columns:1fr;gap:6px;margin:12px 0}#student-ui button{text-align:left;white-space:normal}#view-status{font-size:14px;line-height:1.5;margin:0;padding:10px 14px;background:var(--d-accent-soft)}.stage{grid-template-rows:auto minmax(240px,1fr) auto auto}
#target-marker{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#a32323;border:2px solid #a32323;padding:3px 6px;font-size:12px;pointer-events:none;white-space:nowrap}
@media(max-width:900px){.wrap{display:block;height:auto}.panel{border-left:0;max-height:none}.stage{height:100vh;height:100dvh;min-height:500px}}
</style></head><body>
<div class="wrap"><div class="stage">
<p id="view-status" role="status" aria-live="polite"></p>
<div class="viewport"><canvas id="cv" tabindex="0" aria-label="다층 연구시설의 3차원 모델. 드래그로 회전, Shift 드래그로 이동, 휠로 확대">WebGL2를 지원하는 브라우저에서 실행하세요.</canvas><span id="target-marker" hidden></span></div>
<p class="instructions">드래그: 트랙볼 회전 · Shift+드래그 / 오른쪽 드래그: 평행 이동 · 휠: 거리 조절<br>키보드 방향키: 회전 · + / −: 거리 조절 · Home: 전체 보기</p>
<pre class="readings" id="readings"></pre></div>
<div class="panel"><h1>복합 연구시설 관찰</h1>
<div class="actions"><button class="btn" id="home" type="button">최초 시점으로</button><button class="btn" id="measure" type="button">측정 시작 / 초기화</button></div>
<div id="student-ui"></div><details><summary>관찰 과제 8건</summary><ol class="tasks" id="tasks"></ol></details>
<p class="note">건물 규모 약 20m · 가장 작은 명판 폭 0.28m. 전체 보기와 세부 관찰에 필요한 시점이 다릅니다. 명판은 한쪽 면에만 글자가 있습니다. O1·O2는 글자가 아니라 높이·폭·돌출을 비교하는 과제입니다.</p>

</div></div>
<script src="demo.js"></script><script src="d04-inspection-model.js?v=3f1b6bc733"></script><script src="d04-inspection-controls.js"></script><script src="d04-inspection-viewer.js?v=8a4c2fbf62"></script><script src="d04-inspection-student.js?v=e71bc4da3b"></script>
</body></html>
